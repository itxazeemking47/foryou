<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#fff3f8">

<title>Wake Your Hubby ⏰♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100svh;
  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    max(18px, env(safe-area-inset-top))
    16px
    max(18px, env(safe-area-inset-bottom));

  font-family: "Quicksand", sans-serif;

  color: #67475d;

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(255,255,255,.95),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 20%,
      rgba(255,176,213,.55),
      transparent 32%
    ),
    radial-gradient(
      circle at 15% 90%,
      rgba(197,181,253,.38),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #fff3f8,
      #f7efff,
      #fff0f6
    );
}


/* =====================================================
   BACKGROUND BLOBS
===================================================== */

.blob {
  position: fixed;

  border-radius: 50%;

  pointer-events: none;

  filter: blur(55px);

  opacity: .55;
}

.blob.one {
  width: 220px;
  height: 220px;

  top: -100px;
  left: -80px;

  background: #ffb7d5;
}

.blob.two {
  width: 260px;
  height: 260px;

  right: -120px;
  bottom: -120px;

  background: #cbbcff;
}


/* =====================================================
   FLOATING DECORATIONS
===================================================== */

.float {
  position: fixed;

  z-index: 1;

  pointer-events: none;

  user-select: none;

  animation:
    floatAround 4s ease-in-out infinite;
}

.f1 {
  top: 9%;
  left: 8%;

  font-size: 24px;

  animation-delay: .2s;
}

.f2 {
  top: 16%;
  right: 8%;

  font-size: 21px;

  animation-delay: .8s;
}

.f3 {
  bottom: 15%;
  left: 7%;

  font-size: 20px;

  animation-delay: 1.4s;
}

.f4 {
  bottom: 11%;
  right: 9%;

  font-size: 25px;

  animation-delay: 2s;
}

@keyframes floatAround {

  0%,100% {
    transform:
      translateY(0)
      rotate(0deg);
  }

  50% {
    transform:
      translateY(-9px)
      rotate(5deg);
  }

}


/* =====================================================
   MAIN CARD
===================================================== */

.alarm-card {

  position: relative;

  z-index: 5;

  width: min(430px, 100%);

  padding: 34px 24px 27px;

  text-align: center;

  border-radius: 32px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.88),
      rgba(255,243,249,.70)
    );

  border: 1px solid rgba(255,255,255,.95);

  box-shadow:
    0 25px 70px rgba(113,61,94,.18),
    inset 0 1px 0 rgba(255,255,255,.95);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  animation:
    cardIn .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn {

  from {
    opacity: 0;

    transform:
      translateY(25px)
      scale(.95);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* =====================================================
   DECORATIVE CORNERS
===================================================== */

.corner {
  position: absolute;

  font-size: 23px;

  opacity: .7;
}

.corner.tl {
  top: 13px;
  left: 16px;
}

.corner.tr {
  top: 13px;
  right: 16px;
}

.corner.bl {
  bottom: 13px;
  left: 16px;
}

.corner.br {
  bottom: 13px;
  right: 16px;
}


/* =====================================================
   ALARM ICON
===================================================== */

.alarm-icon {

  width: 76px;
  height: 76px;

  margin: 0 auto 13px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 25px;

  background:
    linear-gradient(
      145deg,
      #fff,
      #ffe6f1
    );

  box-shadow:
    0 12px 28px rgba(236,72,153,.15);

  font-size: 38px;

  animation:
    alarmFloat 2.7s ease-in-out infinite;
}

@keyframes alarmFloat {

  0%,100% {
    transform: translateY(0) rotate(-2deg);
  }

  50% {
    transform: translateY(-6px) rotate(2deg);
  }

}


/* =====================================================
   HEADING
===================================================== */

h1 {

  font-family:
    "DM Serif Display",
    serif;

  font-size:
    clamp(28px, 8vw, 38px);

  line-height: 1.1;

  color: #754d6c;

  text-shadow:
    0 4px 15px rgba(236,72,153,.13);
}

.script {

  margin-top: 5px;

  font-family:
    "Great Vibes",
    cursive;

  font-size:
    clamp(29px, 8vw, 34px);

  color: #ec4899;
}


/* =====================================================
   MINI LABEL
===================================================== */

.badge {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  margin-bottom: 13px;

  padding: 7px 13px;

  border-radius: 100px;

  background: rgba(255,224,239,.75);

  color: #c55c91;

  font-size: 10px;

  font-weight: 700;

  letter-spacing: .08em;

  text-transform: uppercase;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {

  max-width: 330px;

  margin:
    20px auto
    23px;

  font-size: 14px;

  line-height: 1.8;

  font-weight: 600;

  color: #765b70;
}

.message strong {

  color: #ec4899;
}


/* =====================================================
   DIVIDER
===================================================== */

.divider {

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 9px;

  margin-bottom: 20px;

  color: #e293b7;

  font-size: 13px;
}

.divider::before,
.divider::after {

  content: "";

  width: 60px;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #e8a8c5,
      transparent
    );
}


/* =====================================================
   ALARM BUTTON
===================================================== */

.wake-button {

  position: relative;

  width: 100%;

  min-height: 58px;

  border: none;

  border-radius: 20px;

  padding: 15px 17px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 9px;

  overflow: hidden;

  cursor: pointer;

  font-family: "Quicksand", sans-serif;

  font-size: 16px;

  font-weight: 700;

  color: white;

  background:
    linear-gradient(
      135deg,
      #ff7fb5,
      #ec65a5,
      #a78bfa
    );

  box-shadow:
    0 13px 30px rgba(236,72,153,.27),
    inset 0 1px 0 rgba(255,255,255,.45);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.wake-button::before {

  content: "";

  position: absolute;

  top: -30%;
  left: -90px;

  width: 55px;
  height: 170%;

  background:
    rgba(255,255,255,.3);

  transform: rotate(25deg);

  transition:
    left .65s ease;
}

.wake-button:hover::before {
  left: 120%;
}

.wake-button:hover {

  transform:
    translateY(-3px);

  box-shadow:
    0 17px 36px rgba(236,72,153,.35);
}

.wake-button:active {

  transform:
    scale(.965);
}

.wake-button:disabled {

  cursor: default;

  opacity: .9;

  transform: none;
}


/* =====================================================
   BUTTON ICON
===================================================== */

.button-icon {

  font-size: 21px;

  animation:
    bellShake 1.8s ease-in-out infinite;
}

@keyframes bellShake {

  0%,75%,100% {
    transform: rotate(0);
  }

  80% {
    transform: rotate(-10deg);
  }

  85% {
    transform: rotate(10deg);
  }

  90% {
    transform: rotate(-7deg);
  }

  95% {
    transform: rotate(5deg);
  }

}


/* =====================================================
   STATUS
===================================================== */

.status {

  display: none;

  margin-top: 15px;

  padding: 11px 13px;

  border-radius: 15px;

  font-size: 12px;

  font-weight: 700;

  line-height: 1.5;

  background:
    rgba(255,255,255,.65);

  border:
    1px solid rgba(255,255,255,.85);
}

.status.show {
  display: block;
}


/* =====================================================
   SMALL NOTE
===================================================== */

.note {

  margin-top: 16px;

  font-size: 11px;

  line-height: 1.6;

  color: #a27b96;
}


/* =====================================================
   SIGNATURE
===================================================== */

.signature {

  margin-top: 19px;

  font-family:
    "Great Vibes",
    cursive;

  font-size: 20px;

  color: #c7789d;

  transform: rotate(-2deg);
}


/* =====================================================
   HEART POP
===================================================== */

.pop {

  position: fixed;

  z-index: 100;

  pointer-events: none;

  font-size: 18px;

  animation:
    popUp .75s ease-out forwards;
}

@keyframes popUp {

  0% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(.5);
  }

  100% {
    opacity: 0;

    transform:
      translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
      )
      scale(1.25);
  }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

  body {
    padding-left: 12px;
    padding-right: 12px;
  }

  .alarm-card {

    padding:
      29px 19px 25px;

    border-radius: 28px;
  }

  .alarm-icon {

    width: 69px;
    height: 69px;

    font-size: 34px;
  }

  .message {

    font-size: 13.5px;

    line-height: 1.75;
  }

  .wake-button {

    min-height: 56px;

    font-size: 15px;
  }

  .float {
    opacity: .65;
  }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-height: 650px) {

  .alarm-card {
    padding-top: 22px;
    padding-bottom: 20px;
  }

  .alarm-icon {

    width: 58px;
    height: 58px;

    font-size: 29px;

    margin-bottom: 8px;
  }

  .message {

    margin-top: 13px;
    margin-bottom: 15px;
  }

  .signature {
    margin-top: 12px;
  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration: .01ms !important;

    animation-iteration-count: 1 !important;

    transition-duration: .01ms !important;
  }

}

</style>
</head>


<body>


<!-- Background -->

<div class="blob one"></div>
<div class="blob two"></div>


<!-- Floating decoration -->

<div class="float f1">🌸</div>
<div class="float f2">🦋</div>
<div class="float f3">✨</div>
<div class="float f4">💗</div>


<!-- Main -->

<main class="alarm-card">


  <div class="corner tl">🌷</div>
  <div class="corner tr">🦋</div>
  <div class="corner bl">🌸</div>
  <div class="corner br">💗</div>


  <div class="badge">
    ✦ emergency love button ✦
  </div>


  <div class="alarm-icon">
    ⏰
  </div>


  <h1>
    Wake Up,
    Azeem!
  </h1>


  <div class="script">
    Your Noor is waiting ♡
  </div>


  <div class="message">

    Sooo...
    <br>

    <strong>
      Azeem sleeping again? 🤭
    </strong>

    <br>

    Agar Noor online hai aur tum so rahe ho...
    <br>

    bas ye button daba do. 🌸

  </div>


  <div class="divider">
    ✦ 💕 ✦
  </div>


  <button
    id="wakeButton"
    class="wake-button"
    type="button"
    onclick="wakeUpAzeem()"
  >

    <span
      id="buttonIcon"
      class="button-icon"
    >
      ⏰
    </span>

    <span id="buttonText">
      Wake Up My Lazy Hubby!
    </span>

    <span>
      💥
    </span>

  </button>


  <div
    id="status"
    class="status"
  ></div>


  <div class="note">
    Ek chota sa button...
    aur Azeem ki neend ka game over. 😂💕
  </div>


  <div class="signature">
    — From Your Noor 🌷
  </div>


</main>


<script>

/* =====================================================
   SECURITY
   IMPORTANT:
   This file is:
   /alarm/alarm.html

   Root index is:
   /index.html

   Therefore ../index.html is REQUIRED.
===================================================== */

(function () {

  const loggedIn =
    sessionStorage.getItem("isLoggedIn") === "true";

  const accessGranted =
    sessionStorage.getItem("accessGranted") === "true";


  if (!loggedIn && !accessGranted) {

    window.location.replace("../index.html");

  }

})();


/* =====================================================
   PUSHBULLET CONFIG
===================================================== */

/*
   IMPORTANT:

   Paste your NEW Pushbullet API token here.

   Example:

   const PUSHBULLET_API_KEY =
       "YOUR_NEW_PUSHBULLET_TOKEN";

   Do NOT paste the old exposed token.
*/

const PUSHBULLET_API_KEY =
  "PASTE_NEW_PUSHBULLET_API_KEY_HERE";


/* =====================================================
   ELEMENTS
===================================================== */

const wakeButton =
  document.getElementById("wakeButton");

const buttonText =
  document.getElementById("buttonText");

const buttonIcon =
  document.getElementById("buttonIcon");

const statusBox =
  document.getElementById("status");


/* =====================================================
   STATUS HELPER
===================================================== */

function showStatus(message, type) {

  statusBox.textContent = message;

  statusBox.classList.add("show");

  if (type === "success") {

    statusBox.style.color = "#22966b";

  }

  else if (type === "error") {

    statusBox.style.color = "#dc6075";

  }

  else {

    statusBox.style.color = "#a45b88";

  }

}


/* =====================================================
   HEART / SPARKLE EFFECT
===================================================== */

function createPop(x, y) {

  const symbols = [
    "♡",
    "💗",
    "✨",
    "🌸",
    "💕"
  ];

  const pop =
    document.createElement("div");

  pop.className = "pop";

  pop.textContent =
    symbols[
      Math.floor(
        Math.random() * symbols.length
      )
    ];

  pop.style.left = x + "px";
  pop.style.top = y + "px";

  pop.style.setProperty(
    "--x",
    ((Math.random() - .5) * 100) + "px"
  );

  pop.style.setProperty(
    "--y",
    (-50 - Math.random() * 70) + "px"
  );

  document.body.appendChild(pop);

  setTimeout(() => {
    pop.remove();
  }, 800);
}


/* =====================================================
   BUTTON EFFECT
===================================================== */

wakeButton.addEventListener(
  "pointerdown",
  function (event) {

    createPop(
      event.clientX,
      event.clientY
    );

  },
  { passive: true }
);


/* =====================================================
   WAKE UP AZEEM
===================================================== */

async function wakeUpAzeem() {


  /* -----------------------------------------------
     Prevent double click
  ------------------------------------------------ */

  if (wakeButton.disabled) {
    return;
  }


  /* -----------------------------------------------
     Check API token
  ------------------------------------------------ */

  if (
    !PUSHBULLET_API_KEY ||
    PUSHBULLET_API_KEY ===
      "PASTE_NEW_PUSHBULLET_API_KEY_HERE"
  ) {

    showStatus(
      "Pushbullet API key abhi add nahi ki gayi. 🔑",
      "error"
    );

    return;
  }


  /* -----------------------------------------------
     Button state
  ------------------------------------------------ */

  wakeButton.disabled = true;

  buttonIcon.textContent = "🚨";

  buttonText.textContent =
    "Waking Up Azeem...";


  showStatus(
    "Noor ka alarm ja raha hai... 🚀💕",
    "loading"
  );


  /* -----------------------------------------------
     Mobile vibration
  ------------------------------------------------ */

  if (
    "vibrate" in navigator
  ) {

    navigator.vibrate([
      120,
      80,
      120,
      80,
      180
    ]);

  }


  /* -----------------------------------------------
     Extra visual effect
  ------------------------------------------------ */

  for (let i = 0; i < 6; i++) {

    setTimeout(() => {

      createPop(
        window.innerWidth / 2 +
          (Math.random() - .5) * 120,

        window.innerHeight / 2 +
          40
      );

    }, i * 80);

  }


  /* -----------------------------------------------
     Pushbullet notification
  ------------------------------------------------ */

  const payload = {

    type: "note",

    title:
      "🚨 NOOR IS ONLINE!! 🚨",

    body:
      "Utho Azeem! Tumhari Noor yaad kar rahi hai. Jaldi online aao! ❤️⏰"

  };


  try {

    const response =
      await fetch(
        "https://api.pushbullet.com/v2/pushes",
        {

          method: "POST",

          headers: {

            "Access-Token":
              PUSHBULLET_API_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(payload)

        }
      );


    /* ---------------------------------------------
       SUCCESS
    --------------------------------------------- */

    if (response.ok) {

      buttonIcon.textContent =
        "💖";

      buttonText.textContent =
        "Azeem Has Been Summoned! 😂";


      showStatus(
        "Alarm successfully bhej diya! Ab ringtone bajni chahiye. 😘💕",
        "success"
      );


      /* More celebration */

      for (let i = 0; i < 10; i++) {

        setTimeout(() => {

          createPop(
            Math.random() *
              window.innerWidth,

            window.innerHeight * .65
          );

        }, i * 100);

      }

    }


    /* ---------------------------------------------
       ERROR
    --------------------------------------------- */

    else {

      let errorMessage =
        "Pushbullet notification nahi ja saki. 💗";

      try {

        const errorData =
          await response.json();

        if (errorData.error?.message) {

          errorMessage =
            errorData.error.message;

        }

      }

      catch (_) {}


      showStatus(
        errorMessage,
        "error"
      );

      resetButton();

    }

  }


  /* -----------------------------------------------
     NETWORK ERROR
  ------------------------------------------------ */

  catch (error) {

    console.error(
      "Pushbullet Error:",
      error
    );

    showStatus(
      "Internet ya Pushbullet connection ka issue hai. 🌸",
      "error"
    );

    resetButton();

  }

}


/* =====================================================
   RESET
===================================================== */

function resetButton() {

  setTimeout(() => {

    wakeButton.disabled = false;

    buttonIcon.textContent =
      "⏰";

    buttonText.textContent =
      "Wake Up My Lazy Hubby!";

  }, 5000);

}


/* =====================================================
   PREVENT ACCIDENTAL CONTEXT MENU
===================================================== */

document.addEventListener(
  "contextmenu",
  function (event) {

    event.preventDefault();

  }
);


/* =====================================================
   BASIC SHORTCUT BLOCK
===================================================== */

document.addEventListener(
  "keydown",
  function (event) {

    const key =
      event.key.toLowerCase();


    if (

      event.key === "F12" ||

      (
        event.ctrlKey &&
        event.shiftKey &&
        ["i", "j", "c"].includes(key)
      ) ||

      (
        event.ctrlKey &&
        key === "u"
      )

    ) {

      event.preventDefault();

    }

  }
);

</script>

</body>
</html>
